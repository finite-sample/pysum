name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python in pyproject.toml. This job previously ran
        # on 3.7 alone, which is both end-of-life and below the declared floor,
        # so pip refused to install the package and the job failed.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # There are no test files in this repository -- `find . -name 'test*.py'`
      # returns nothing -- so the previous `nosetests -s` step asserted nothing
      # on every run it has ever made, and reported success for it. nose is
      # also unmaintained and does not install on 3.11+.
      #
      # Until there are real tests, this checks the two things that can
      # actually fail: that the package builds, and that it imports from an
      # installed wheel rather than from the source tree next to it.
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl

      - name: Import from the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          python -c "import pysum.summary_tool as m; assert hasattr(m, 'SummaryTool')"

  yamllint:
    name: Yaml Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Run yamllint
        run: yamllint .github/
